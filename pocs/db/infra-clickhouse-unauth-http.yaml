# artex-name: infra-clickhouse-unauth-http
# artex-severity: critical
# artex-tags: clickhouse,database,unauth,infra,intranet
# artex-desc: Detect unauthenticated ClickHouse HTTP interface (:8123) executing read-only SELECT version().
# artex-guidance: Configure user passwords and IP network restrictions in ClickHouse users.xml.
id: infra-clickhouse-unauth-http
info:
  name: ClickHouse Unauthenticated HTTP Interface
  severity: critical
http:
  - method: GET
    path:
      - "{{BaseURL}}/?query=SELECT%20version()"
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        regex:
          - '^[0-9]{2}\.[0-9]+\.[0-9]+'
