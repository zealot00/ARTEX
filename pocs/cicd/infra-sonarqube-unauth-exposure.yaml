# artex-name: infra-sonarqube-unauth-exposure
# artex-severity: medium
# artex-tags: sonarqube,ci,code,unauth,infra,intranet
# artex-desc: Detect unauthenticated SonarQube API (/api/projects/search, /api/issues/search) exposing internal project names and code issues.
# artex-guidance: Enable 'Force user authentication' in SonarQube security settings.
id: infra-sonarqube-unauth-exposure
info:
  name: SonarQube Unauthenticated Project Exposure
  severity: medium
http:
  - method: GET
    path:
      - "{{BaseURL}}/api/projects/search?ps=5"
      - "{{BaseURL}}/api/components/search?qualifiers=TRK&ps=5"
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        words:
          - '"components"'
          - '"paging"'
        condition: and
