# artex-name: infra-kibana-unauth-exposure
# artex-severity: high
# artex-tags: kibana,elk,monitor,unauth,infra,intranet
# artex-desc: Detect unauthenticated Kibana status/saved-objects API exposure.
# artex-guidance: Check whether Kibana allows anonymous log search or index pattern inspection.
id: infra-kibana-unauth-exposure
info:
  name: Kibana Unauthenticated API Exposure
  severity: high
http:
  - method: GET
    path:
      - "{{BaseURL}}/api/status"
      - "{{BaseURL}}/api/saved_objects/_find?type=index-pattern&per_page=5"
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        words:
          - '"kibana"'
          - '"saved_objects"'
        condition: or
